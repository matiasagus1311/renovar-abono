<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<title>Renovar abono</title>
<!--
  La página que abre el celular del socio al escanear el QR del kiosco
  (docs/plan_renovar_con_qr.md). Lee la fila de su QR en Supabase con la
  clave pública (config.js) y las funciones de nube/supabase.sql: no ve
  ningún dato personal, por eso saluda con "Hola" sin nombre.
  En la demo, el "Pagar" es simulado; en la versión real lleva al link de
  Mercado Pago, y el abono lo carga la app solo si Mercado Pago confirma.
-->
<style>
  /* Los grises de la app (ui/tema.py), el azul como acento (o el
     color_principal del gimnasio, desde config.js), verde para el ahorro y lo
     aprobado, ámbar para los avisos. */
  :root {
    --fondo: #f3f4f6; --tarjeta: #ffffff; --texto: #17191c; --tenue: #6b7078; --borde: #e2e4e8; --borde-fuerte: #c4c8ce;
    --acento: #2f63d1; --sobre-acento: #ffffff; --acento-suave: rgba(47, 99, 209, .09);
    --bien: #2b8556; --bien-suave: rgba(43, 133, 86, .10);
    --ojo: #a2650e; --ojo-suave: rgba(214, 145, 40, .13);
    --mal: #b0473e; --mal-suave: rgba(176, 71, 62, .09);
    --sombra: 0 1px 2px rgba(20, 24, 31, .05), 0 4px 14px rgba(20, 24, 31, .05);
    --barra: rgba(243, 244, 246, .82);
    --rapido: 120ms; --normal: 260ms; --suave: cubic-bezier(.2, .8, .2, 1); --resorte: cubic-bezier(.34, 1.4, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #141414; --tarjeta: #1d1d1d; --texto: #ececec; --tenue: #a3a3a3; --borde: #2e2e2e; --borde-fuerte: #4d4d4d;
      --acento: #5b8bf0; --sobre-acento: #ffffff; --acento-suave: rgba(91, 139, 240, .14);
      --bien: #62be8b; --bien-suave: rgba(98, 190, 139, .12);
      --ojo: #e0ad5c; --ojo-suave: rgba(224, 173, 92, .12);
      --mal: #e2897f; --mal-suave: rgba(226, 137, 127, .11);
      --sombra: none; --barra: rgba(20, 20, 20, .82);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100dvh; }
  main { max-width: 460px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 18px 132px; }
  button { font: inherit; color: inherit; }

  /* ---- Encabezado ---- */
  .encabezado { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
  .gimnasio { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--acento); margin: 0 0 4px; }
  h1 { font-size: 1.9rem; line-height: 1.05; font-weight: 750; letter-spacing: -.025em; margin: 0; }
  .bajada { color: var(--tenue); margin: 6px 0 0; }
  .reloj { flex: none; position: relative; width: 58px; height: 58px; display: grid; place-items: center; }
  .reloj svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .reloj circle { fill: none; stroke-width: 4; }
  .reloj .pista { stroke: var(--borde); }
  .reloj .avance { stroke: var(--acento); stroke-linecap: round; transition: stroke-dashoffset 1s linear, stroke .3s; }
  .reloj.poco .avance { stroke: var(--ojo); }
  .reloj span { font-size: .8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .demo { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 650; color: var(--ojo);
          background: var(--ojo-suave); border-radius: 99px; padding: 3px 10px; margin-top: 10px; }
  .demo::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ---- Avisos ---- */
  .aviso { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; padding: 12px 14px; margin: 0 0 14px;
           font-size: .92rem; background: var(--acento-suave); }
  .aviso svg { flex: none; width: 20px; height: 20px; margin-top: 1px; stroke: var(--acento); }
  .aviso.ahorro { background: var(--bien-suave); } .aviso.ahorro svg { stroke: var(--bien); }
  .aviso.ojo { background: var(--ojo-suave); } .aviso.ojo svg { stroke: var(--ojo); }
  .aviso b { font-weight: 650; }
  svg.icono { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Abonos ---- */
  .titulo-seccion { font-size: .8rem; font-weight: 650; color: var(--tenue); text-transform: uppercase; letter-spacing: .08em; margin: 20px 2px 10px; }
  .abonos { display: grid; gap: 10px; }
  .abono { position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; width: 100%;
           background: var(--tarjeta); border: 1.5px solid var(--borde); border-radius: 16px; padding: 15px 16px; text-align: left;
           cursor: pointer; box-shadow: var(--sombra);
           transition: transform var(--rapido) var(--suave), border-color var(--normal) var(--suave), background var(--normal) var(--suave); }
  .abono:active { transform: scale(.985); }
  .abono .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--borde-fuerte); display: grid; place-items: center;
                  transition: border-color var(--normal) var(--suave), background var(--normal) var(--suave); }
  .abono .radio svg { width: 13px; height: 13px; stroke: var(--sobre-acento); stroke-width: 3.2; transform: scale(0);
                      transition: transform var(--normal) var(--resorte); }
  .abono[aria-checked="true"] { border-color: var(--acento); background: linear-gradient(var(--acento-suave), var(--acento-suave)), var(--tarjeta); }
  .abono[aria-checked="true"] .radio { border-color: var(--acento); background: var(--acento); }
  .abono[aria-checked="true"] .radio svg { transform: scale(1); }
  .abono .nombre { font-weight: 650; }
  .abono .marca { display: inline-block; margin-top: 4px; font-size: .72rem; font-weight: 650; color: var(--acento);
                  background: var(--acento-suave); border-radius: 6px; padding: 1px 7px; }
  .abono .precio { font-weight: 750; font-size: 1.05rem; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; letter-spacing: -.01em; }
  .abono .precio.rebajado { color: var(--bien); }
  .abono .lista { display: block; font-size: .78rem; font-weight: 450; color: var(--tenue); text-decoration: line-through; }

  .enlace { background: none; border: 0; padding: 10px 2px; margin-top: 8px; color: var(--acento); font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; }
  .enlace svg { width: 16px; height: 16px; stroke: currentColor; transition: transform var(--normal) var(--suave); }
  .enlace[aria-expanded="true"] svg { transform: rotate(180deg); }
  .desplegable { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--normal) var(--suave); }
  .desplegable > div { overflow: hidden; }
  .desplegable.abierto { grid-template-rows: 1fr; }
  .desplegable p { margin: 0 0 4px; padding: 2px 2px 0; color: var(--tenue); font-size: .92rem; }

  /* ---- Barra de pago ---- */
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--barra);
           backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
           border-top: 1px solid var(--borde); padding: 12px 18px max(14px, env(safe-area-inset-bottom));
           transform: translateY(0); transition: transform var(--normal) var(--suave); }
  .barra.fuera { transform: translateY(110%); }
  .barra .dentro { max-width: 460px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .barra .resumen { flex: 1; min-width: 0; }
  .barra .que { font-size: .8rem; color: var(--tenue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra .cuanto { display: inline-block; font-weight: 750; font-size: 1.15rem; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }

  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px;
           padding: 14px 22px; font-weight: 650; background: var(--acento); color: var(--sobre-acento); cursor: pointer;
           transition: transform var(--rapido) var(--suave), opacity var(--normal), filter var(--rapido); }
  .boton:active:not(:disabled) { transform: scale(.96); filter: brightness(.94); }
  .boton:disabled { opacity: .35; cursor: default; }
  .boton.ancho { display: flex; width: 100%; margin-top: 10px; }
  .boton.secundario { background: var(--tarjeta); color: var(--texto); border: 1.5px solid var(--borde); box-shadow: var(--sombra); }
  .boton svg { width: 18px; height: 18px; stroke: currentColor; }

  /* ---- Estados ---- */
  .estado { text-align: center; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 20px; padding: 34px 22px 28px;
            box-shadow: var(--sombra); margin-top: 6px; }
  .estado h2 { font-size: 1.35rem; letter-spacing: -.015em; margin: 0 0 8px; }
  .estado p { margin: 0 auto 6px; color: var(--tenue); max-width: 30ch; }
  .estado p b { color: var(--texto); }
  .sello { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center; }
  .sello svg { width: 34px; height: 34px; stroke: #fff; stroke-width: 3; }
  .sello.ok { background: var(--bien); animation: aparecer 420ms var(--resorte) both; box-shadow: 0 0 0 10px var(--bien-suave); }
  .sello.ok path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: trazar 380ms 260ms var(--suave) forwards; }
  .sello.mal { background: var(--mal-suave); } .sello.mal svg { stroke: var(--mal); stroke-width: 2.2; }
  .sello.info { background: var(--acento-suave); } .sello.info svg { stroke: var(--acento); stroke-width: 2.2; }
  .girador { width: 54px; height: 54px; margin: 4px auto 18px; border-radius: 50%; border: 4px solid var(--borde); border-top-color: var(--acento);
             animation: girar .9s linear infinite; }
  .puntos::after { content: ""; animation: puntos 1.4s steps(4) infinite; }

  /* ---- Código y cámara ---- */
  .otro-codigo { margin-top: 16px; }
  .campo-codigo { font: inherit; font-size: 1.7rem; font-weight: 700; letter-spacing: .32em; text-indent: .32em; text-transform: uppercase;
                  text-align: center; width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid var(--borde-fuerte);
                  background: var(--tarjeta); color: var(--texto); transition: border-color var(--normal), box-shadow var(--normal); }
  .campo-codigo:focus { outline: none; border-color: var(--acento); box-shadow: 0 0 0 4px var(--acento-suave); }
  .ayuda { font-size: .85rem; color: var(--tenue); margin: 0 2px 8px; }
  .entra { animation: entrar var(--normal) var(--suave) both; }
  .camara { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; background: #000; margin: 14px 0 8px; }
  .camara video { width: 100%; height: 100%; object-fit: cover; }
  .camara .esquinas { position: absolute; inset: 16%; }
  .camara .esquinas::before, .camara .esquinas::after, .camara .esquinas i::before, .camara .esquinas i::after {
    content: ""; position: absolute; width: 34px; height: 34px; border: 4px solid #fff; border-radius: 6px; }
  .camara .esquinas::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .camara .esquinas::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .camara .esquinas i::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .camara .esquinas i::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .camara .linea { position: absolute; left: 18%; right: 18%; top: 18%; height: 2px; background: rgba(255,255,255,.75);
                   box-shadow: 0 0 12px rgba(255,255,255,.6); animation: escanear 2.2s ease-in-out infinite alternate; }

  /* ---- Pie ---- */
  .pie { text-align: center; font-size: .78rem; color: var(--tenue); margin-top: 26px; display: flex; gap: 6px; justify-content: center; align-items: center; }
  .pie svg { width: 14px; height: 14px; stroke: currentColor; }

  /* ---- Movimiento ---- */
  .pantalla > * { animation: entrar var(--normal) var(--suave) both; }
  .pantalla > *:nth-child(2) { animation-delay: 30ms; } .pantalla > *:nth-child(3) { animation-delay: 60ms; }
  .pantalla > *:nth-child(4) { animation-delay: 90ms; } .pantalla > *:nth-child(n+5) { animation-delay: 120ms; }
  .pantalla .abono { animation: entrar var(--normal) var(--suave) both; }
  .pantalla .abono:nth-child(2) { animation-delay: 50ms; } .pantalla .abono:nth-child(3) { animation-delay: 100ms; }
  .pantalla .abono:nth-child(n+4) { animation-delay: 150ms; }
  .cambio { animation: latido 300ms var(--suave); }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes aparecer { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes trazar { to { stroke-dashoffset: 0; } }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes puntos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @keyframes escanear { from { top: 18%; } to { top: 82%; } }
  @keyframes latido { 50% { transform: scale(1.06); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important;
                             transition-duration: 1ms !important; }
    .girador { animation: girar 2s linear infinite !important; }
  }
  .oculto { display: none !important; }
  :focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="barra fuera" id="barra" aria-hidden="true">
  <div class="dentro">
    <div class="resumen"><div class="que" id="barra-que">Elegí un abono</div><div class="cuanto" id="barra-cuanto">—</div></div>
    <button class="boton" id="pagar" type="button" disabled>Pagar</button>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
"use strict";
const CONFIG = window.CONFIG_RENOVAR || {};
const SEGUNDOS_ENTRE_CONSULTAS = 3;
const RADIO_RELOJ = 25, VUELTA_RELOJ = 2 * Math.PI * RADIO_RELOJ;
const app = document.getElementById("app");
const barra = document.getElementById("barra");
const botonPagar = document.getElementById("pagar");
let codigo = (new URLSearchParams(location.search).get("c") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
let fila = null, elegido = null, consulta = null, reloj = null, pagando = false, flujoCamara = null, total = null, vista = null;

// El color del gimnasio que cobra: viene con cada QR (y si no, el de config.js).
function ponerColor(color) {
  if (!/^#[0-9a-fA-F]{6}$/.test(color || "")) return;
  const n = parseInt(color.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const raiz = document.documentElement.style;
  raiz.setProperty("--acento", color);
  raiz.setProperty("--sobre-acento", (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? "#141414" : "#ffffff");
  raiz.setProperty("--acento-suave", `rgba(${r}, ${g}, ${b}, .12)`);
}
ponerColor(CONFIG.colorPrincipal);
const nombreDelGimnasio = () => (fila && fila.gimnasio) || CONFIG.nombreGimnasio || "";

const pesos = new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 2 });
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ICONOS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  reloj: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.8l3 1.8"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  etiqueta: '<path d="M20 12.6l-7.4 7.4a1.5 1.5 0 0 1-2.1 0L3.6 13.1A2 2 0 0 1 3 11.7V5a2 2 0 0 1 2-2h6.7a2 2 0 0 1 1.4.6l6.9 6.9a1.5 1.5 0 0 1 0 2.1z"/><path d="M7.5 7.5h.01"/>',
  aviso: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
  abajo: '<path d="M6 9l6 6 6-6"/>',
  camara: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  teclado: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',
  candado: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
};
const icono = (nombre) => `<svg class="icono" viewBox="0 0 24 24" aria-hidden="true">${ICONOS[nombre]}</svg>`;

async function llamar(funcion, parametros) {
  const respuesta = await fetch(`${CONFIG.url}/rest/v1/rpc/${funcion}`, {
    method: "POST",
    headers: { "apikey": CONFIG.clavePublica, "Authorization": `Bearer ${CONFIG.clavePublica}`, "Content-Type": "application/json" },
    body: JSON.stringify(parametros),
  });
  if (!respuesta.ok) throw new Error(`${respuesta.status}`);
  const texto = await respuesta.text();
  return texto ? JSON.parse(texto) : null;
}

// ---- Pantallas ----------------------------------------------------------------

function mostrar(nombre, html, conBarra = false) {
  // La animación de entrada va solo al cambiar de pantalla.
  app.className = vista !== nombre ? "pantalla" : "";
  vista = nombre;
  app.innerHTML = html;
  barra.classList.toggle("fuera", !conBarra);
  barra.setAttribute("aria-hidden", String(!conBarra));
}

function encabezado(bajada, conReloj) {
  return `<header class="encabezado"><div>
      ${nombreDelGimnasio() ? `<p class="gimnasio">${esc(nombreDelGimnasio())}</p>` : ""}
      <h1>Hola</h1>${bajada ? `<p class="bajada">${bajada}</p>` : ""}
      ${fila && fila.demo ? '<span class="demo">Demo · no se cobra nada</span>' : ""}
    </div>${conReloj ? `<div class="reloj" id="reloj" role="timer" aria-label="Tiempo para pagar">
      <svg viewBox="0 0 58 58"><circle class="pista" cx="29" cy="29" r="${RADIO_RELOJ}"/>
      <circle class="avance" id="reloj-avance" cx="29" cy="29" r="${RADIO_RELOJ}" stroke-dasharray="${VUELTA_RELOJ}"/></svg>
      <span id="reloj-texto"></span></div>` : ""}</header>`;
}

function pie() {
  return fila && !fila.demo ? `<p class="pie">${icono("candado")} El pago lo procesa Mercado Pago</p>` : "";
}

function pintar() {
  if (!fila) return;
  if (fila.estado === "pagado") return pintarPagado();
  if (fila.estado === "cancelado" && fila.motivo === "precio_actualizado") return pintarPrecioActualizado();
  if (fila.estado === "cancelado") return pintarTerminado("Este QR ya no se puede usar", "Si querés renovar, volvé a pasar por la cámara o consultá en recepción.");
  if (fila.estado === "vencido") return pintarTerminado("Este QR ya venció", "Volvé a pasar por la cámara para que aparezca uno nuevo, o renová en recepción.");
  if (fila.pagado_simulado || pagando) return pintarConfirmando();
  pintarElegir();
}

function pintarElegir() {
  if (total === null) total = Math.max(fila.segundos_restantes, 1);
  const abonos = fila.abonos.map((a) => {
    const rebajado = a.precio_lista && a.precio_lista > a.precio;
    return `<button class="abono" type="button" role="radio" data-id="${a.id}" aria-checked="${elegido === a.id}">
      <span class="radio">${icono("check")}</span>
      <span><span class="nombre">${esc(a.nombre)}</span>${a.el_de_siempre ? '<br><span class="marca">El que venías usando</span>' : ""}</span>
      <span class="precio${rebajado ? " rebajado" : ""}">${rebajado ? `<span class="lista">${pesos.format(a.precio_lista)}</span>` : ""}${pesos.format(a.precio)}</span>
    </button>`;
  }).join("");
  mostrar("elegir", `
    ${encabezado("Elegí con qué abono renovás.", true)}
    ${fila.rebaja ? `<div class="aviso ahorro">${icono("etiqueta")}<span>Tenés <b>${esc(fila.rebaja)}</b>. Ya está aplicado en cada precio.</span></div>` : ""}
    ${fila.tenia_convenio ? `<div class="aviso ojo">${icono("aviso")}<span>La vez pasada tuviste <b>convenio o descuento</b>. Pedilo en recepción antes de pagar: el precio se actualiza solo en esta pantalla.</span></div>` : ""}
    <p class="titulo-seccion">Abonos</p>
    <div class="abonos" role="radiogroup" aria-label="Abonos">${abonos}</div>
    <button class="enlace" id="descuento" type="button" aria-expanded="false" aria-controls="info-descuento">¿Tenés un descuento? ${icono("abajo")}</button>
    <div class="desplegable" id="info-descuento"><div><p>Pedíselo a recepción: te lo habilitan y el precio se actualiza en esta misma pantalla, sin volver a escanear.</p></div></div>
    ${pie()}`, true);
  pintarReloj();
  pintarBarra(false);
  app.querySelectorAll(".abono").forEach((b) => b.addEventListener("click", () => elegir(Number(b.dataset.id))));
  const enlace = document.getElementById("descuento");
  enlace.addEventListener("click", () => {
    const abierto = document.getElementById("info-descuento").classList.toggle("abierto");
    enlace.setAttribute("aria-expanded", String(abierto));
  });
}

function elegir(id) {
  const otro = elegido !== id;
  elegido = id;
  app.querySelectorAll(".abono").forEach((b) => b.setAttribute("aria-checked", String(Number(b.dataset.id) === id)));
  pintarBarra(otro);
  if (otro && navigator.vibrate) navigator.vibrate(8);
}

function pintarBarra(conLatido) {
  const abono = fila && fila.abonos.find((a) => a.id === elegido);
  document.getElementById("barra-que").textContent = abono ? abono.nombre : "Elegí un abono";
  const cuanto = document.getElementById("barra-cuanto");
  cuanto.textContent = abono ? pesos.format(abono.precio) : "—";
  if (conLatido && abono) { cuanto.classList.remove("cambio"); void cuanto.offsetWidth; cuanto.classList.add("cambio"); }
  botonPagar.disabled = !abono;
  botonPagar.textContent = fila && fila.demo ? "Pagar (simulado)" : "Pagar";
}

function pintarReloj() {
  const texto = document.getElementById("reloj-texto");
  if (!texto || !fila) return;
  const s = Math.max(0, fila.segundos_restantes);
  texto.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  document.getElementById("reloj-avance").style.strokeDashoffset = String(VUELTA_RELOJ * (1 - s / (total || 1)));
  document.getElementById("reloj").classList.toggle("poco", s <= 30);
}

async function pagar() {
  const abono = fila && fila.abonos.find((a) => a.id === elegido);
  if (!abono) return;
  if (!fila.demo) {
    // La versión real: la pantalla de pago de Mercado Pago. Lo que diga el
    // celular no cuenta: el abono se carga si Mercado Pago confirma el pago.
    if (abono.link) location.href = abono.link;
    return;
  }
  pagando = true; pintarConfirmando();
  try {
    fila = await llamar("qr_pagar_simulado", { p_codigo: codigo, p_abono: abono.id }) || fila;
  } catch (e) { pagando = false; pintarError("No pudimos conectarnos. Volvé a intentar."); return; }
  pintar();
}

function pintarConfirmando() {
  mostrar("confirmando", `${encabezado("", false)}
    <section class="estado"><div class="girador" role="progressbar" aria-label="Confirmando"></div>
      <h2>Confirmando tu pago<span class="puntos"></span></h2>
      <p>No cierres esta página. En unos segundos el gimnasio carga tu abono.</p></section>`);
}

function pintarPagado() {
  pararConsultas();
  const abono = fila.abonos.find((a) => a.id === fila.abono_pagado);
  mostrar("pagado", `${encabezado("", false)}
    <section class="estado"><div class="sello ok">${icono("check")}</div>
      <h2>Pago aprobado</h2>
      <p>${abono ? `Tu abono <b>${esc(abono.nombre)}</b> ya está cargado.` : "Tu abono ya está cargado."}</p>
      <p>Podés pasar a entrenar.</p></section>`);
  if (navigator.vibrate) navigator.vibrate([12, 60, 18]);
}

function pintarTerminado(titulo, texto) {
  pararConsultas();
  mostrar("terminado", `${encabezado("", false)}
    <section class="estado"><div class="sello mal">${icono("reloj")}</div><h2>${esc(titulo)}</h2><p>${esc(texto)}</p></section>
    ${botonesOtroCodigo()}`);
  conectarOtroCodigo();
}

function pintarPrecioActualizado() {
  pararConsultas();
  mostrar("actualizado", `${encabezado("", false)}
    <section class="estado"><div class="sello info">${icono("etiqueta")}</div><h2>Se actualizó tu precio</h2>
      <p>Recepción te habilitó un convenio o descuento. En la pantalla del gimnasio hay un QR nuevo con tu precio.</p></section>
    ${botonesOtroCodigo()}`);
  conectarOtroCodigo();
}

function botonesOtroCodigo() {
  return `<div class="otro-codigo">
    <button class="boton ancho" id="escanear" type="button">${icono("camara")} Volver a escanear el QR</button>
    <button class="boton ancho secundario" id="escribir" type="button">${icono("teclado")} Escribir el código</button>
    <div id="lugar-codigo"></div></div>`;
}

function conectarOtroCodigo() {
  document.getElementById("escanear").addEventListener("click", abrirCamara);
  document.getElementById("escribir").addEventListener("click", formularioCodigo);
}

function formularioCodigo() {
  pararCamara();
  const lugar = document.getElementById("lugar-codigo");
  lugar.innerHTML = `<form id="form-codigo" class="entra" style="margin-top:16px">
      <p class="ayuda">Son las 6 letras y números que están abajo del QR.</p>
      <input class="campo-codigo" id="codigo-nuevo" maxlength="6" autocomplete="off" autocapitalize="characters"
             spellcheck="false" aria-label="Código del QR">
      <button class="boton ancho" type="submit" id="seguir" disabled>Seguir</button></form>`;
  const campo = document.getElementById("codigo-nuevo");
  const seguir = document.getElementById("seguir");
  campo.addEventListener("input", () => {
    campo.value = campo.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    seguir.disabled = campo.value.length !== 6;
  });
  campo.focus();
  document.getElementById("form-codigo").addEventListener("submit", (e) => {
    e.preventDefault();
    if (campo.value.length === 6) cambiarCodigo(campo.value);
  });
}

async function abrirCamara() {
  const lugar = document.getElementById("lugar-codigo");
  lugar.innerHTML = `<div class="entra"><div class="camara"><video id="video" playsinline muted></video><div class="esquinas"><i></i></div><div class="linea"></div></div>
    <p class="ayuda" style="text-align:center">Apuntá al QR de la pantalla del gimnasio.</p></div>`;
  const video = document.getElementById("video");
  try {
    flujoCamara = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
  } catch (e) {
    lugar.innerHTML = `<p class="ayuda entra" style="margin-top:14px">No pudimos usar la cámara (hace falta darle permiso). Podés escribir el código.</p>`;
    return;
  }
  video.srcObject = flujoCamara;
  await video.play();
  const lienzo = document.createElement("canvas");
  const contexto = lienzo.getContext("2d", { willReadFrequently: true });
  const detector = "BarcodeDetector" in window ? new BarcodeDetector({ formats: ["qr_code"] }) : null;
  const mirar = async () => {
    if (!flujoCamara) return;
    let texto = null;
    if (video.readyState >= 2) {
      if (detector) {
        try { const hallados = await detector.detect(video); texto = hallados[0]?.rawValue || null; } catch (e) { texto = null; }
      }
      if (!texto && window.jsQR) {
        lienzo.width = video.videoWidth; lienzo.height = video.videoHeight;
        contexto.drawImage(video, 0, 0);
        const imagen = contexto.getImageData(0, 0, lienzo.width, lienzo.height);
        texto = window.jsQR(imagen.data, imagen.width, imagen.height)?.data || null;
      }
    }
    const nuevo = texto && codigoDelTexto(texto);
    if (nuevo) { if (navigator.vibrate) navigator.vibrate(15); pararCamara(); cambiarCodigo(nuevo); return; }
    requestAnimationFrame(mirar);
  };
  requestAnimationFrame(mirar);
}

function codigoDelTexto(texto) {
  try {
    const c = new URL(texto).searchParams.get("c");
    if (c && /^[A-Za-z0-9]{6}$/.test(c)) return c;
  } catch (e) { /* no es un link */ }
  return /^[A-Za-z0-9]{6}$/.test(texto.trim()) ? texto.trim() : null;
}

function pararCamara() {
  if (flujoCamara) { flujoCamara.getTracks().forEach((t) => t.stop()); flujoCamara = null; }
}

function pintarSinCodigo(mensaje) {
  mostrar("sin-codigo", `${encabezado(esc(mensaje || "Para renovar tu abono, escaneá el QR de la pantalla del gimnasio o escribí su código."), false)}
    ${botonesOtroCodigo()}`);
  conectarOtroCodigo();
}

function pintarError(mensaje) {
  mostrar("error", `${encabezado("", false)}
    <section class="estado"><div class="sello mal">${icono("info")}</div><h2>Algo no anduvo</h2><p>${esc(mensaje)}</p></section>
    <button class="boton ancho" type="button" id="reintentar">Volver a intentar</button>`);
  document.getElementById("reintentar").addEventListener("click", empezar);
}

// ---- Datos ----------------------------------------------------------------------

function pararConsultas() { clearInterval(consulta); clearInterval(reloj); }

function cambiarCodigo(nuevo) {
  codigo = nuevo.toUpperCase().replace(/[^A-Z0-9]/g, "");
  history.replaceState(null, "", `?c=${codigo}`);
  fila = null; elegido = null; pagando = false; total = null;
  empezar();
}

async function empezar() {
  pararCamara();
  pararConsultas();
  if (!CONFIG.url) { pintarError("La página todavía no está configurada."); return; }
  if (!/^[A-Z0-9]{6}$/.test(codigo)) { pintarSinCodigo(); return; }
  mostrar("cargando", `<section class="estado"><div class="girador"></div><p>Cargando…</p></section>`);
  try {
    fila = await llamar("qr_abrir", { p_codigo: codigo });
  } catch (e) { pintarError("No pudimos conectarnos. Revisá tu internet y volvé a intentar."); return; }
  if (!fila) { pintarSinCodigo("No encontramos ese código. Revisalo en la pantalla del gimnasio."); return; }
  ponerColor(fila.color);
  if (fila.gimnasio) document.title = `Renovar abono · ${fila.gimnasio}`;
  pintar();
  consulta = setInterval(actualizar, SEGUNDOS_ENTRE_CONSULTAS * 1000);
  reloj = setInterval(() => {
    if (fila && fila.segundos_restantes > 0) { fila.segundos_restantes--; pintarReloj(); }
  }, 1000);
}

async function actualizar() {
  try {
    const nueva = await llamar("qr_leer", { p_codigo: codigo });
    if (!nueva) return;
    const cambio = nueva.estado !== fila.estado || nueva.pagado_simulado !== fila.pagado_simulado;
    fila = nueva;
    if (cambio) pintar(); else pintarReloj();
  } catch (e) { /* sin señal un momento: se vuelve a probar */ }
}

botonPagar.addEventListener("click", pagar);
empezar();
</script>
